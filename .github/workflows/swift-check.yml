name: "Swift: Check"

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.6
    with:
      license_header_check_enabled: false
      api_breakage_check_enabled: true
      docs_check_enabled: true
      format_check_enabled: true
      shell_check_enabled: true
      yamllint_check_enabled: true
      python_lint_check_enabled: false

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.6
    strategy:
      fail-fast: false
      matrix:
        swift-flags:
          - ''
          - '--traits libssh2'
    with:
      swift_flags: ${{ matrix.swift-flags }}

      # Linux
      enable_linux_checks: true
      linux_swift_versions: '["6.2", "6.3"]'

      # Static Linux SDK
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.2", "6.3"]'

      # Swift SDK for Wasm (TODO: build issues in libgit2)
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      wasm_sdk_versions: '["6.3"]'

      # Swift SDK for Android (TODO: awaiting 6.3 Android SDK)
      enable_android_sdk_build: false
      android_sdk_versions: '["6.3"]'

      # Windows (TODO: fix issues)
      enable_windows_checks: false
      enable_windows_docker: false
      windows_swift_versions: '["6.2", "6.3"]'

      # macOS (requires self-hosted runners)
      enable_macos_checks: false

      # iOS (requires self-hosted runners)
      enable_ios_checks: false

  macos-tests:
    name: Tests
    uses: ./.github/workflows/macos-tests.yml
    strategy:
      fail-fast: false
      matrix:
        swift-flags:
          - ''
          - '--traits libssh2'
    with:
      swift_versions: '["6.2"]'
      swift_flags: ${{ matrix.swift-flags }}

  ios-tests:
    name: Tests
    uses: ./.github/workflows/ios-tests.yml
    with:
      swift_versions: '["6.2"]'
